function rowHtml(x,right){return '<div class="row '+(x.__marked?'mark':'')+'" data-id="'+x.id+'" data-right="'+right+'" onclick="markItem(this)"><input type="checkbox" '+(x.__marked?'checked':'')+' onclick="event.preventDefault()"><div><div class="row-title">'+esc(x.name)+'</div><div class="row-meta">#'+x.id+' · '+esc(x.status&&x.status.name||'No status')+' · '+esc(x.priority&&x.priority.name||'No priority')+(x.description?' · '+esc(String(x.description).slice(0,150)):'')+'</div></div><span class="extra">v'+esc(x.version||'')+'</span></div>'}window.drawPicker=function(){var a=visibleAvailable(),s=visibleSelected();document.getElementById('available').innerHTML=a.map(function(x){return rowHtml(x,false)}).join('')||'<div class="guidance">No matching available Test Cases.</div>';document.getElementById('selectedPane').innerHTML=s.map(function(x){return rowHtml(x,true)}).join('')||'<div class="guidance">No selected Test Cases.</div>';document.getElementById('availableCount').textContent='('+a.length+')';document.getElementById('selectedCount').textContent='('+s.length+')'};window.markItem=function(el){var id=el.dataset.id,right=el.dataset.right==='true',x=right?working[id]:items.find(function(y){return String(y.id)===String(id)});x.__marked=!x.__marked;drawPicker()};window.selectVisible=function(){visibleAvailable().forEach(function(x){x.__marked=true});drawPicker();return false};window.clearVisible=function(){visibleSelected().forEach(function(x){delete working[x.id]});drawPicker();return false};window.addMarked=function(){items.forEach(function(x){if(x.__marked&&!working[x.id])working[x.id]=Object.assign({},x,{__marked:false})});drawPicker();return false};window.removeMarked=function(){Object.keys(working).forEach(function(k){if(working[k].__marked)delete working[k]});drawPicker();return false};window.openPicker=function(){working={};Object.keys(selected).forEach(function(k){working[k]=Object.assign({},selected[k],{__marked:false})});document.getElementById('picker').classList.remove('hidden');document.getElementById('query').value='';return loadItems().then(drawPicker).catch(function(e){document.getElementById('pickerStatus').textContent=e.message})};window.closePicker=function(){document.getElementById('picker').classList.add('hidden');return false};window.applyPicker=function(){selected={};Object.keys(working).forEach(function(k){selected[k]=Object.assign({},working[k],{__marked:false})});closePicker();preview=null;render();return false};
function previewHtml(r){var a=[['Matched',r.matchedTestCases||0],['Eligible runs',r.eligibleRuns||0],['Selected runs',r.selectedRuns||0],['Planned copies',r.plannedCopies||0],['Already reused',r.alreadyReused||0],['Failed',r.failedCopies||0]];return '<div class="summary">'+a.map(function(x,i){return '<div class="metric '+(i===3?'plan':'')+' '+(i===5?'fail':'')+'"><div class="num">'+x[1]+'</div><div class="lab">'+x[0]+'</div></div>'}).join('')+'</div><div class="panel"><div class="panel-title">Reuse preview and execution details</div><div class="board"><table><thead><tr><th>Source Test Case</th><th>Target Test Case</th><th>Source Run</th><th>Evidence</th><th>Action</th><th>Outcome / Created Item</th></tr></thead><tbody>'+((r.results||[]).map(function(x){return '<tr><td>'+itemLink(x.sourceTestCaseId,(x.sourceTestCaseName||'Test Case')+' #'+x.sourceTestCaseId)+'</td><td>'+itemLink(x.targetTestCaseId,(x.targetTestCaseName||'Test Case')+' #'+x.targetTestCaseId)+'</td><td>'+itemLink(x.sourceRunId,(x.sourceRunName||'Test Run')+' #'+x.sourceRunId)+'</td><td>'+evidenceHtml(x)+'</td><td><span class="badge">'+esc(x.action)+'</span></td><td>'+outcomeHtml(x)+'</td></tr>'}).join(''))+'</tbody></table></div></div>'}
window.runPreview=function(){try{var p=validate();showBusy('Preparing preview');return custom('/preview',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)}).then(function(r){preview=r;hideBusy();render();document.getElementById('executeButton').disabled=!(r&&r.plannedCopies>0)}).catch(function(e){hideBusy();showError(e)})}catch(e){showError(e)}};window.executeReuse=function(){var p=validate();p.operationKey='stream-'+p.sourceStreamId+'-to-'+p.targetStreamId+'-'+Date.now();showBusy('Executing reuse');return custom('/execute',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)}).then(function(r){return poll(r.operationId)}).catch(function(e){hideBusy();showError(e)})};function poll(id){return custom('/status/'+encodeURIComponent(id)).then(function(r){document.getElementById('operationMessage').textContent=r.status;if(['COMPLETED','COMPLETED_WITH_ERRORS','FAILED'].indexOf(r.status)>=0){preview=r;hideBusy();render();return}setTimeout(function(){poll(id)},1200)})}function showBusy(t){document.getElementById('operationTitle').textContent=t;document.getElementById('overlay').classList.remove('hidden')}function hideBusy(){document.getElementById('overlay').classList.add('hidden')}function showError(e){render();root.insertAdjacentHTML('afterbegin','<div class="error">'+esc(e&&e.message?e.message:e)+'</div>')}
function init(){if(window.parent===window){root.innerHTML='<div class="success">Static file deployed correctly.</div>';return}var auth=typeof api.authenticate==='function'?api.authenticate():Promise.resolve();auth.then(function(){return api.getConfig()}).then(function(r){applyConfig(r);render();if(!project)return null;return loadProjectDetails().then(function(){render();return loadCatalog()}).then(render)}).catch(showError);stable()}init()})();
</script></body></html>
